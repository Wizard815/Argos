macros:
  "server": "llama-server --host 127.0.0.1 --port ${PORT}"
  "ctx": "32768"

models:
  "qwen3-30b-a3b":
    cmd: |
      ${server}
      # MoE: keep experts of 20 layers on the CPU
      -m /models/Qwen3-30B-A3B-Q4_K_M.gguf
      -c ${ctx} -ngl 99 --n-cpu-moe 20 -fa on
      -ctk q8_0 -ctv q8_0
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 300
  "llama-3.2-3b":
    cmd: >
      ${server} -m /models/Llama-3.2-3B-Instruct-Q8_0.gguf -c 8192 -ngl 99
  "broken":
    proxy: http://127.0.0.1:9999
