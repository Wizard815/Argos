# generated by setup.sh -- edit freely
services:
  argos:
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./remote-llama.sh:/app/bin/remote-llama:ro
      - ${REMOTE_SSH_KEY_FILE}:/run/secrets/argos_ssh_key:ro
    # Mode 3: GPUs belong to the backend containers, not Argos.
    devices: !reset []
    group_add: !reset []
    environment:
      - ROCM_SSH_HOST=${ROCM_SSH_HOST}
      - ROCM_SSH_PORT=${ROCM_SSH_PORT}
      - ROCM_SSH_USER=${ROCM_SSH_USER}
      - ROCM_SSH_BIN=${ROCM_SSH_BIN}
    networks:
      - ai_net
networks:
  ai_net:
    external: true
