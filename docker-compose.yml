services:
  argos:
    build:
      context: .
      args:
        # an image that already has your llama.cpp (llama-server) in it
        BASE_IMAGE: ${BASE_IMAGE:-mx-llamacpp-mx-llamacpp-ssh}
        BASE_TAG: ${BASE_TAG:-latest}
    container_name: argos
    restart: unless-stopped
    ports:
      # one port: the Argos web page, the OpenAI API (/v1) and the engine's endpoints
      - "${ARGOS_PORT:-8080}:8080"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
    volumes:
      - ${MODELS_DIR:-./models}:/app/models
      - ./data:/data
      - ./config.d:/app/config.d
    environment:
      # starting values for the Schedule page (setup.sh writes them to .env); the page can change them later
      - ARGOS_SCHEDULE_POOL=${ARGOS_SCHEDULE_POOL:-}
      - ARGOS_SCHEDULE_CARDS=${ARGOS_SCHEDULE_CARDS:-}
